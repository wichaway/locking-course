<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;600;700;800&family=Great+Vibes&display=swap');

:root {
  --ink: oklch(0.16 0.012 285);
  --paper: oklch(0.97 0.005 285);
  --muted: oklch(0.86 0.01 285);
  --accent-lt: oklch(0.82 0.15 288);
  --accent: oklch(0.74 0.17 288);
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; background:var(--ink); font-family:'Heebo',sans-serif; overflow:hidden; }

.stage { position:relative; width:1080px; height:1920px; overflow:hidden; }

.photo {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:50% 24%;
}

.scrim-top {
  position:absolute; top:0; left:0; right:0; height:420px;
  background:linear-gradient(180deg, oklch(0.08 0.01 285 / .78) 0%, oklch(0.08 0.01 285 / 0) 100%);
}
.scrim-bottom {
  position:absolute; bottom:0; left:0; right:0; height:980px;
  background:linear-gradient(0deg, oklch(0.07 0.01 285 / .96) 0%, oklch(0.07 0.01 285 / .82) 38%, oklch(0.07 0.01 285 / 0) 100%);
}

.top-bar { position:relative; z-index:2; display:flex; justify-content:center; gap:8px; padding:36px 56px 0; }
.top-bar .seg { height:4px; flex:1; max-width:120px; border-radius:100px; background:oklch(1 0 0 / .28); }
.top-bar .seg.active { background:var(--paper); }

.brand { position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:10px; margin-top:26px; }
.brand .mark { font-family:'Suez One',serif; font-size:26px; color:var(--paper); }
.brand .mark .q { color:var(--accent-lt); }
.brand .script { font-family:'Great Vibes',cursive; font-size:22px; color:var(--accent-lt); margin-inline-start:2px; }

.content {
  position:absolute; z-index:2; left:0; right:0; bottom:0;
  padding:0 60px 92px;
  display:flex; flex-direction:column; align-items:flex-start;
}

.eyebrow {
  display:inline-flex; align-items:center; gap:8px;
  background:oklch(1 0 0 / .10); border:1px solid oklch(1 0 0 / .28);
  backdrop-filter:blur(6px);
  border-radius:100px; padding:10px 20px; margin-bottom:22px;
  font-size:16px; font-weight:700; letter-spacing:.1em; color:var(--paper);
}
.eyebrow .dot { width:8px; height:8px; border-radius:50%; background:var(--accent-lt); }

h1 {
  font-family:'Suez One',serif; font-weight:400; color:var(--paper);
  font-size:96px; line-height:1.02; margin-bottom:20px;
}

.tag {
  display:inline-flex; align-items:center; gap:6px;
  background:oklch(0.74 0.17 288 / .22); border:1px solid oklch(0.82 0.15 288 / .55);
  color:var(--accent-lt);
  border-radius:100px; padding:9px 20px; font-size:18px; font-weight:700;
  margin-bottom:26px;
}

.bio { font-size:21px; line-height:1.68; color:var(--muted); max-width:900px; margin-bottom:40px; }

.footer {
  display:flex; align-items:center; gap:14px;
  border-top:1px solid oklch(1 0 0 / .22); padding-top:26px; width:100%;
}
.footer .fdot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; }
.footer .ftext { font-size:18px; color:var(--muted); }
.footer .ftext b { color:var(--paper); }
</style>
</head>
